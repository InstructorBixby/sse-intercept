[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-intercept"
version = "0.5.0"
description = "Intercepting proxy for streaming HTTP responses: SSE, chunked, NDJSON"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
keywords = [
  "proxy", "mitmproxy", "sse", "server-sent-events", "ndjson",
  "streaming", "http", "interception", "security", "testing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["mitmproxy>=11", "PyYAML>=6"]

[project.urls]
Homepage = "http://git.c01n31.net/c01n31pan1c/sse-intercept"
Changelog = "http://git.c01n31.net/c01n31pan1c/sse-intercept/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
[project.scripts]
sseint = "sseint.cli:main"

[tool.setuptools.packages.find]
include = ["sseint*"]

[tool.setuptools.package-data]
sseint = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RET", "SIM"]

[tool.mypy]
files = ["sseint"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Not strict, deliberately. `sseint/api.py` is the surface other code
# imports and it is fully annotated and checked; arguing with the
# curses layer about Optional would buy nothing.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["mitmproxy.*", "yaml"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["sseint"]
omit = ["sseint/view.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
