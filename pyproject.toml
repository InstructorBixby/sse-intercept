[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-intercept"
version = "0.5.0"
description = "Intercepting proxy for streaming HTTP responses: SSE, chunked, NDJSON"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
dependencies = ["mitmproxy>=11", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
[project.scripts]
sseint = "sseint.cli:main"

[tool.setuptools.packages.find]
include = ["sseint*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
sseint = ["py.typed"]

[tool.mypy]
files = ["sseint"]
no_implicit_optional = true
disallow_untyped_defs = false
