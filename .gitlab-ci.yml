stages:
  - check
  - docs
  - build

variables:
  UV_CACHE_DIR: .cache/uv

.py:
  image: python:$PY-slim
  cache:
    key:
      files:
        - pyproject.toml
        - constraints-dev.txt
    paths:
      - .cache/uv
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt

test:
  extends: .py
  stage: check
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  script:
    - ruff check .
    - pytest -q --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

quirks:
  extends: .py
  stage: check
  variables:
    PY: "3.13"
  parallel:
    matrix:
      - QUIRK: [none, crlf, no-final-blank, split-separator,
                keepalive, gzip, gzip-unlabelled, no-sentinel,
                content-length, huge-frame]
  script:
    - pytest -q tests/test_integration.py -k "$QUIRK"

container:
  stage: check
  tags:
    - podman
  script:
    - podman build -t sseint:$CI_COMMIT_SHORT_SHA -f Containerfile .
    - podman run --rm sseint:$CI_COMMIT_SHORT_SHA --version
    - podman run --rm sseint:$CI_COMMIT_SHORT_SHA proxy || test $? -eq 2
  after_script:
    - podman rmi -f sseint:$CI_COMMIT_SHORT_SHA || true

docs:
  stage: docs
  image: python:3.13-slim
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[docs]"
  script:
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week

wheel:
  stage: build
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - pip install -q uv build
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt
  script:
    - ruff check .
    - pytest -q
    - python tools/check_tag.py
    # The wheel goes onto machines with no checkout on them, so it
    # has to be able to answer "which commit are you" by itself.
    - python tools/stamp.py
    - python -m build
    - sha256sum dist/*
  artifacts:
    paths:
      - dist/
    expire_in: never
