stages:
  - check
  - docs
  - build

variables:
  # The cache has to live inside the build directory for the runner
  # to be able to archive it.
  UV_CACHE_DIR: .cache/uv

.py:
  image: python:$PY-slim
  cache:
    key:
      files:
        - pyproject.toml
        - constraints-dev.txt
    paths:
      - .cache/uv
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt

test:
  extends: .py
  stage: check
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  script:
    - ruff check .
    - mypy
    - pytest -q --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

docs:
  stage: docs
  image: python:3.13-slim
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[docs]"
  script:
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week

# A tag builds an sdist and a wheel and keeps them. Nothing is
# uploaded anywhere: the artefact is what I copy onto the machine
# that has to run the proxy, and the pipeline exists so that the file
# I copy came off a green suite rather than off whatever was in my
# working tree at the time.
wheel:
  stage: build
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - pip install -q uv build
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt
  script:
    - ruff check .
    - mypy
    - pytest -q
    # A package whose metadata disagrees with its tag is a package I
    # cannot reason about six months later, holding a wheel off a
    # laptop and trying to work out what is in it.
    - |
      python - <<'PY'
      import os, pathlib, re, sys
      tag = os.environ["CI_COMMIT_TAG"].lstrip("v")
      src = pathlib.Path("sseint/__init__.py").read_text()
      got = re.search(r'__version__ = "([^"]+)"', src).group(1)
      if got != tag:
          sys.exit(f"tag {tag} != __version__ {got}")
      PY
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: never
