stages:
  - check
  - docs
  - build

variables:
  # The cache has to live inside the build directory for the runner
  # to be able to archive it.
  UV_CACHE_DIR: .cache/uv

.py:
  image: python:$PY-slim
  cache:
    key:
      files:
        - pyproject.toml
        - constraints-dev.txt
    paths:
      - .cache/uv
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt

test:
  extends: .py
  stage: check
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  script:
    - ruff check .
    - mypy
    - pytest -q --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

# The shell runner on this box. There is no docker-in-docker here and
# I am not standing one up to build one image. (The job cannot be
# called `image` either -- that is a reserved keyword and the lint
# says so, eventually.)
container:
  stage: check
  tags:
    - podman
  script:
    - podman build -t sseint:$CI_COMMIT_SHORT_SHA -f Containerfile .
    - podman run --rm sseint:$CI_COMMIT_SHORT_SHA --version
    # Exit 2 is the refusal. An image that proxied anything with no
    # scope would be the worst possible default, and the one thing
    # about this image worth a test.
    - podman run --rm sseint:$CI_COMMIT_SHORT_SHA proxy || test $? -eq 2
  after_script:
    - podman rmi -f sseint:$CI_COMMIT_SHORT_SHA || true

docs:
  stage: docs
  image: python:3.13-slim
  before_script:
    - pip install -q uv
    - uv pip install --system -e ".[docs]"
  script:
    - mkdocs build --strict
  artifacts:
    paths:
      - site/
    expire_in: 1 week

wheel:
  stage: build
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - pip install -q uv build
    - uv pip install --system -e ".[dev]" -c constraints-dev.txt
  script:
    - ruff check .
    - mypy
    - pytest -q
    - |
      python - <<'PY'
      import os, pathlib, re, sys
      tag = os.environ["CI_COMMIT_TAG"].lstrip("v")
      src = pathlib.Path("sseint/__init__.py").read_text()
      got = re.search(r'__version__ = "([^"]+)"', src).group(1)
      if got != tag:
          sys.exit(f"tag {tag} != __version__ {got}")
      PY
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: never
